name: "AI-BOM Scan"
description: "Discover and inventory AI/LLM components in your codebase"
author: "Trusera"
# Required permissions in calling workflow:
#   permissions:
#     security-events: write   # For SARIF upload to GitHub Code Scanning
#     contents: read           # For checkout
branding:
  icon: "shield"
  color: "blue"
inputs:
  path:
    description: "Path to scan"
    required: false
    default: "."
  format:
    description: "Output format (sarif, json, cyclonedx, table, markdown)"
    required: false
    default: "sarif"
  severity:
    description: "Minimum severity to report (critical, high, medium, low)"
    required: false
    default: ""
  output:
    description: "Output file path"
    required: false
    default: "ai-bom-results.sarif"
  upload-sarif:
    description: "Upload SARIF results to GitHub Code Scanning"
    required: false
    default: "true"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
    - name: Install ai-bom
      shell: bash
      run: pip install ai-bom
    - name: Run ai-bom scan
      shell: bash
      continue-on-error: true
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SEVERITY: ${{ inputs.severity }}
      run: |
        args=(scan "$INPUT_PATH" --format "$INPUT_FORMAT" -o "$INPUT_OUTPUT")
        if [ -n "$INPUT_SEVERITY" ]; then
          args+=(--severity "$INPUT_SEVERITY")
        fi
        ai-bom "${args[@]}"
    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.upload-sarif == 'true' && inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
      with:
        sarif_file: ${{ inputs.output }}
