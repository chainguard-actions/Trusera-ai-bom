name: Test basic SARIF scan
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "sarif"
          output: "ai-bom-results.sarif"
          upload-sarif: "false"

      - name: Assert output file was created
        run: |
          echo "Checking for output file: ai-bom-results.sarif"
          if [ ! -f "ai-bom-results.sarif" ]; then
            echo "FAIL: expected output file 'ai-bom-results.sarif' was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file is valid JSON (SARIF is JSON)
        run: |
          echo "Validating SARIF file is valid JSON..."
          if ! python3 -c "import json, sys; json.load(open('ai-bom-results.sarif'))" 2>&1; then
            echo "FAIL: output file is not valid JSON/SARIF"
            exit 1
          fi
          echo "PASS: output file is valid JSON"
