name: Test basic table scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ai-bom scan with default table format
        id: action
        uses: .
        with:
          path: "."
          format: "table"
      - name: Assert scan completed successfully
        run: |
          echo "PASS: ai-bom scan completed with table format"
