name: Test basic SARIF scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "sarif"
          output: "ai-bom-results.sarif"
          upload-sarif: "false"

      - name: Assert SARIF output file exists
        run: |
          echo "Checking for SARIF output file..."
          if [ ! -f "ai-bom-results.sarif" ]; then
            echo "FAIL: expected ai-bom-results.sarif to exist"
            exit 1
          fi
          echo "PASS: ai-bom-results.sarif exists"

      - name: Assert SARIF file is valid JSON
        run: |
          echo "Validating SARIF file is valid JSON..."
          if ! python3 -c "import json, sys; json.load(open('ai-bom-results.sarif'))" 2>&1; then
            echo "FAIL: ai-bom-results.sarif is not valid JSON"
            exit 1
          fi
          echo "PASS: ai-bom-results.sarif is valid JSON"

      - name: Assert SARIF schema version present
        run: |
          echo "Checking SARIF schema..."
          SCHEMA=$(python3 -c "import json; d=json.load(open('ai-bom-results.sarif')); print(d.get('\$schema',''))" 2>/dev/null || echo "")
          VERSION=$(python3 -c "import json; d=json.load(open('ai-bom-results.sarif')); print(d.get('version',''))" 2>/dev/null || echo "")
          echo "schema: $SCHEMA"
          echo "version: $VERSION"
          if [ -z "$SCHEMA" ] && [ -z "$VERSION" ]; then
            echo "FAIL: SARIF file missing schema or version field"
            exit 1
          fi
          echo "PASS: SARIF file has expected structure"
