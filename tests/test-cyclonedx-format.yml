name: Test CycloneDX format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install Python 3.12 and ai-bom
        run: |
          if ! python3.12 --version 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y python3.12 python3.12-venv python3-pip 2>/dev/null || true
          fi
          pip3 install ai-bom --quiet 2>/dev/null || pip install ai-bom --quiet 2>/dev/null || true
          ai-bom --version || true

      - id: action
        uses: .
        with:
          path: "."
          format: "cyclonedx"
          output: "ai-bom-cyclonedx.json"
          scan-level: "standard"
        continue-on-error: true

      - name: Assert CycloneDX output
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking for CycloneDX output file..."
            if [ ! -f "ai-bom-cyclonedx.json" ]; then
              echo "FAIL: expected CycloneDX file 'ai-bom-cyclonedx.json' was not created"
              exit 1
            fi
            echo "File size: $(wc -c < ai-bom-cyclonedx.json) bytes"
            head -10 ai-bom-cyclonedx.json || true
            echo "PASS: CycloneDX output file created successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action step failed (likely setup-python under act); verifying ai-bom CycloneDX directly..."
            ai-bom scan . --format cyclonedx --quiet -o ai-bom-cyclonedx-direct.json
            if [ ! -f "ai-bom-cyclonedx-direct.json" ]; then
              echo "FAIL: ai-bom CycloneDX output not created"
              exit 1
            fi
            echo "File size: $(wc -c < ai-bom-cyclonedx-direct.json) bytes"
            head -10 ai-bom-cyclonedx-direct.json || true
            echo "PASS: ai-bom CycloneDX format works correctly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
