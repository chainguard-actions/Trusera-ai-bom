name: Test CycloneDX format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "cyclonedx"
          output: "ai-bom-cyclonedx.json"
          upload-sarif: "false"

      - name: Assert CycloneDX output file exists
        run: |
          echo "Checking for CycloneDX output file..."
          if [ ! -f "ai-bom-cyclonedx.json" ]; then
            echo "FAIL: expected ai-bom-cyclonedx.json to exist"
            exit 1
          fi
          echo "PASS: ai-bom-cyclonedx.json exists"

      - name: Assert CycloneDX output is valid JSON
        run: |
          echo "Validating CycloneDX JSON output..."
          if ! python3 -c "import json; json.load(open('ai-bom-cyclonedx.json'))" 2>&1; then
            echo "FAIL: ai-bom-cyclonedx.json is not valid JSON"
            exit 1
          fi
          echo "PASS: ai-bom-cyclonedx.json is valid JSON"

      - name: Show CycloneDX output summary
        run: |
          echo "CycloneDX output (first 300 chars):"
          cat ai-bom-cyclonedx.json | head -c 300
          echo ""
          echo "PASS: CycloneDX format scan completed"
