name: Test deep scan level with CycloneDX format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ai-bom deep scan with CycloneDX format
        id: action
        uses: .
        with:
          path: "."
          format: "cyclonedx"
          scan-level: "deep"
          output: "/tmp/ai-bom-cyclonedx.json"
      - name: Assert CycloneDX output file was created
        run: |
          echo "Checking for CycloneDX output file at /tmp/ai-bom-cyclonedx.json"
          if [ ! -f "/tmp/ai-bom-cyclonedx.json" ]; then
            echo "FAIL: CycloneDX output file was not created"
            exit 1
          fi
          echo "PASS: CycloneDX output file exists"
          ls -lh /tmp/ai-bom-cyclonedx.json
          echo "File contents (first 500 chars):"
          head -c 500 /tmp/ai-bom-cyclonedx.json
