name: Test deep scan level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install Python 3.12 and ai-bom
        run: |
          if ! python3.12 --version 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y python3.12 python3.12-venv python3-pip 2>/dev/null || true
          fi
          pip3 install ai-bom --quiet 2>/dev/null || pip install ai-bom --quiet 2>/dev/null || true
          ai-bom --version || true

      - id: action
        uses: .
        with:
          path: "."
          format: "table"
          scan-level: "deep"
        continue-on-error: true

      - name: Assert deep scan ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ai-bom deep scan completed without error"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action step failed (likely setup-python under act); verifying ai-bom deep scan directly..."
            ai-bom scan . --format table --quiet --deep
            echo "PASS: ai-bom deep scan works correctly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
