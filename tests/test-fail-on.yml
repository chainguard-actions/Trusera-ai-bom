name: Test fail-on severity option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "json"
          fail-on: "critical"
          output: "ai-bom-failon.json"
          upload-sarif: "false"

      - name: Assert output file exists
        run: |
          echo "Checking for output file with fail-on option..."
          if [ ! -f "ai-bom-failon.json" ]; then
            echo "FAIL: expected ai-bom-failon.json to exist"
            exit 1
          fi
          echo "PASS: ai-bom-failon.json exists"

      - name: Assert output is valid JSON
        run: |
          echo "Validating JSON output..."
          if ! python3 -c "import json; json.load(open('ai-bom-failon.json'))" 2>&1; then
            echo "FAIL: ai-bom-failon.json is not valid JSON"
            exit 1
          fi
          echo "PASS: ai-bom-failon.json is valid JSON"

      - name: Show fail-on output
        run: |
          echo "fail-on output (first 300 chars):"
          cat ai-bom-failon.json | head -c 300
          echo ""
          echo "PASS: fail-on option handled correctly"
