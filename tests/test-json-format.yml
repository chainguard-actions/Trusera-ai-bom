name: Test JSON format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "json"
          output: "ai-bom-results.json"
          upload-sarif: "false"

      - name: Assert JSON output file exists
        run: |
          echo "Checking for JSON output file..."
          if [ ! -f "ai-bom-results.json" ]; then
            echo "FAIL: expected ai-bom-results.json to exist"
            exit 1
          fi
          echo "PASS: ai-bom-results.json exists"

      - name: Assert JSON file is valid JSON
        run: |
          echo "Validating JSON output file..."
          if ! python3 -c "import json, sys; json.load(open('ai-bom-results.json'))" 2>&1; then
            echo "FAIL: ai-bom-results.json is not valid JSON"
            exit 1
          fi
          echo "PASS: ai-bom-results.json is valid JSON"

      - name: Show JSON output summary
        run: |
          echo "JSON output contents (first 500 chars):"
          python3 -c "
          import json
          with open('ai-bom-results.json') as f:
              data = json.load(f)
          print(str(data)[:500])
          " 2>/dev/null || cat ai-bom-results.json | head -c 500
          echo ""
          echo "PASS: JSON output reviewed"
