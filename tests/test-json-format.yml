name: Test AI-BOM scan with JSON format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "json"
          output: "ai-bom-results.json"
          upload-sarif: "false"

      - name: Assert JSON output file was created
        run: |
          echo "Checking for output file: ai-bom-results.json"
          if [ ! -f "ai-bom-results.json" ]; then
            echo "FAIL: expected output file 'ai-bom-results.json' not found"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file is valid JSON
        run: |
          echo "Validating JSON output file"
          if ! python3 -c "import json, sys; json.load(open('ai-bom-results.json'))" 2>&1; then
            echo "FAIL: output file is not valid JSON"
            exit 1
          fi
          echo "PASS: output file is valid JSON"
