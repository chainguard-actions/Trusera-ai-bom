name: Test AI-BOM scan with markdown format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "markdown"
          output: "ai-bom-results.md"
          upload-sarif: "false"

      - name: Assert output file was created
        run: |
          echo "Checking for output file ai-bom-results.md"
          if [ ! -f "ai-bom-results.md" ]; then
            echo "FAIL: expected output file ai-bom-results.md not found"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file is non-empty
        run: |
          echo "Checking that output file is non-empty"
          if [ ! -s "ai-bom-results.md" ]; then
            echo "WARN: output file is empty (no AI components found)"
          else
            echo "PASS: output file has content"
          fi
          echo "File contents:"
          cat ai-bom-results.md || true
