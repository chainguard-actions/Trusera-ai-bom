name: Test AI-BOM scan with markdown format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "markdown"
          output: "ai-bom-results.md"
          upload-sarif: "false"

      - name: Assert markdown output file was created
        run: |
          echo "Checking for output file: ai-bom-results.md"
          if [ ! -f "ai-bom-results.md" ]; then
            echo "FAIL: expected output file 'ai-bom-results.md' not found"
            exit 1
          fi
          echo "PASS: output file exists"
