name: Test SARIF format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install ai-bom (local source or PyPI)
        run: |
          pip install "$GITHUB_WORKSPACE/action" --quiet 2>/dev/null \
            || pip install ai-bom --quiet 2>/dev/null \
            || true

      - name: Create a sample file to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-target"
          cat > "$GITHUB_WORKSPACE/scan-target/sample.py" << 'EOF'
          import openai
          client = openai.OpenAI(api_key="sk-test")
          response = client.chat.completions.create(
              model="gpt-4",
              messages=[{"role": "user", "content": "Hello"}]
          )
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/scan-target
          format: sarif

      - name: Assert SARIF output file was created
        run: |
          echo "Checking for SARIF output file..."
          if [ ! -f "ai-bom-results.sarif" ]; then
            echo "FAIL: expected ai-bom-results.sarif to exist"
            exit 1
          fi
          echo "PASS: ai-bom-results.sarif exists"

      - name: Assert SARIF file is valid JSON
        run: |
          echo "Validating SARIF file is valid JSON..."
          if ! python3 -c "import json; json.load(open('ai-bom-results.sarif'))"; then
            echo "FAIL: ai-bom-results.sarif is not valid JSON"
            exit 1
          fi
          echo "PASS: ai-bom-results.sarif is valid JSON"
