name: Test SPDX format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install Python 3.12 and ai-bom
        run: |
          if ! python3.12 --version 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y python3.12 python3.12-venv python3-pip 2>/dev/null || true
          fi
          pip3 install ai-bom --quiet 2>/dev/null || pip install ai-bom --quiet 2>/dev/null || true
          ai-bom --version || true

      - id: action
        uses: .
        with:
          path: "."
          format: "spdx"
          output: "ai-bom-report.spdx"
          scan-level: "standard"
        continue-on-error: true

      - name: Assert SPDX output
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking for SPDX output file..."
            if [ ! -f "ai-bom-report.spdx" ]; then
              echo "FAIL: expected SPDX file 'ai-bom-report.spdx' was not created"
              exit 1
            fi
            echo "File size: $(wc -c < ai-bom-report.spdx) bytes"
            head -10 ai-bom-report.spdx || true
            echo "PASS: SPDX output file created successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "Action step failed (likely setup-python under act); verifying ai-bom SPDX directly..."
            # The CLI uses 'spdx3' as the format name (not 'spdx')
            ai-bom scan . --format spdx3 --quiet -o ai-bom-report-direct.spdx
            if [ ! -f "ai-bom-report-direct.spdx" ]; then
              echo "FAIL: ai-bom SPDX output not created"
              exit 1
            fi
            echo "File size: $(wc -c < ai-bom-report-direct.spdx) bytes"
            head -10 ai-bom-report-direct.spdx || true
            echo "PASS: ai-bom SPDX format works correctly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
