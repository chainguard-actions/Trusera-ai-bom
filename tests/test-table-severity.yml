name: Test AI-BOM scan with table format and severity filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          path: "."
          format: "table"
          output: "ai-bom-results.txt"
          severity: "low"
          upload-sarif: "false"

      - name: Assert table output file was created
        run: |
          echo "Checking for output file: ai-bom-results.txt"
          if [ ! -f "ai-bom-results.txt" ]; then
            echo "FAIL: expected output file 'ai-bom-results.txt' not found"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert output file is non-empty
        run: |
          echo "Checking output file is non-empty"
          if [ ! -s "ai-bom-results.txt" ]; then
            echo "INFO: output file is empty (no findings at low severity or above)"
          else
            echo "PASS: output file has content"
          fi
          echo "PASS: scan completed successfully"
